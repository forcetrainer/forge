name: forge memory check

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: forge_memory fmt --check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/forge_memory.py fmt --check
